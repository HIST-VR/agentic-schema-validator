[project]
name = "agentic-schema-validator"
version = "1.1.0"
description = "Agentic structured extraction with Pydantic schemas and an Instructor retry loop."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "email-validator>=2.2",
    "instructor[google-genai]>=1.11",
    "openai>=1.70",
    "pydantic[email]>=2.11",
    "python-dotenv>=1.1",
    "streamlit>=1.45",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["extraction_engine*", "ui*"]

[tool.setuptools.package-data]
extraction_engine = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
